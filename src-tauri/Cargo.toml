[package]
name = "volume-mixer-2"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "volume_mixer_2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
anyhow = "1"
thiserror = "2"
directories = "5"
jpeg-encoder = "0.6"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

# The live-glass capture encodes a JPEG every frame; unoptimized, that alone
# is slow enough to make `npm run dev` feel laggy. Optimize just the codecs.
[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3
